[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkscry"
version = "0.1.0"
description = "Claude Code / Codex 状态仪表盘，BLE 推送到 EPD-nRF5 墨水屏"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "bleak>=0.22",
    "Pillow>=10.1",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4; sys_platform == 'darwin'"]

[project.scripts]
inkscry = "inkscry.cli:main"
inkscry-bar = "inkscry.menubar:main"

[tool.setuptools]
packages = ["inkscry"]
